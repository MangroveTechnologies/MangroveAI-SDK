name: CI

# Pull requests and pushes run offline checks only. Live contract requests
# require an explicit workflow_dispatch and an approved GitHub Environment.

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token; this workflow never receives API credentials.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable + dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/
      - name: Unit tests
        run: pytest tests/ --ignore=tests/integration -v
